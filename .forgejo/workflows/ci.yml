name: ts-reviewer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Check and build ts-reviewer
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      FORGEJO_SHA: ${{ forgejo.sha }}
    steps:
      - name: Check out the event revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore reviewer tests
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="${RUNNER_TEMP:-/tmp}/ts-reviewer-nuget"
          mkdir -p -- "${NUGET_PACKAGES}"
          exec dotnet restore \
            tests/TerraScale.Reviewer.Tests/TerraScale.Reviewer.Tests.csproj \
            --runtime linux-x64 --nologo

      - name: Verify dependency audit failure handling
        run: python3 -m unittest discover -s scripts -p test_check_nuget_vulnerabilities.py

      - name: Fail closed on vulnerable NuGet packages
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="${RUNNER_TEMP:-/tmp}/ts-reviewer-nuget"
          python3 scripts/check_nuget_vulnerabilities.py \
            src/TerraScale.Reviewer/TerraScale.Reviewer.csproj \
            tests/TerraScale.Reviewer.Tests/TerraScale.Reviewer.Tests.csproj

      - name: Build reviewer tests and service
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="${RUNNER_TEMP:-/tmp}/ts-reviewer-nuget"
          exec dotnet build \
            tests/TerraScale.Reviewer.Tests/TerraScale.Reviewer.Tests.csproj \
            --configuration Release --no-restore --nologo

      - name: Run reviewer tests
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="${RUNNER_TEMP:-/tmp}/ts-reviewer-nuget"
          mkdir -p -- artifacts/ci/tests
          test_log="artifacts/ci/tests/reviewer-tests.log"
          dotnet run \
            --project tests/TerraScale.Reviewer.Tests/TerraScale.Reviewer.Tests.csproj \
            --configuration Release --no-build --no-restore -- \
            --minimum-expected-tests 1 2>&1 | tee "${test_log}"
          grep -Fq 'Test run summary: Passed!' "${test_log}"
          grep -Eq 'failed: 0' "${test_log}"
          report="$(find tests -type f -path '*/TestResults/*-report.html' -print -quit)"
          test -n "${report}"
          cp -- "${report}" artifacts/ci/tests/reviewer-tunit-report.html
          # The multi-process qualification test emits its captured process logs,
          # final queue state, and a self-validated receipt; fail closed if absent.
          test -s artifacts/ci/tests/multiprocess/qualification-receipt.json
          (cd artifacts/ci/tests && \
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) \
            > artifacts/ci/tests/SHA256SUMS
          (cd artifacts/ci/tests && sha256sum --check --strict SHA256SUMS)
          jq -n \
            --arg sourceCommit "${FORGEJO_SHA:?event SHA is required}" \
            --arg testLog "reviewer-tests.log" \
            --arg report "reviewer-tunit-report.html" \
            --arg digests "SHA256SUMS" \
            '{schemaVersion: 1, sourceCommit: $sourceCommit, testLog: $testLog, report: $report, digests: $digests}' \
            > artifacts/ci/tests/test-receipt.json

      - name: Upload reviewer test evidence
        uses: https://data.forgejo.org/actions/upload-artifact@v4.4.3
        with:
          # The runner validates action input defaults against the YAML core
          # schema; upload-artifact declares these as quoted strings, so they
          # must be overridden with real booleans or the step fails to start.
          include-hidden-files: false
          overwrite: false
          name: ts-reviewer-tests-${{ forgejo.sha }}
          path: artifacts/ci/tests
          if-no-files-found: error
          retention-days: 30

      - name: Build and inspect the release image
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="${RUNNER_TEMP:-/tmp}/ts-reviewer-nuget"

          source_commit="$(git rev-parse HEAD)"
          test "${source_commit}" = "${FORGEJO_SHA:?event SHA is required}"
          mkdir -p -- artifacts/ci/container-publish
          dotnet publish \
            src/TerraScale.Reviewer/TerraScale.Reviewer.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            --output artifacts/ci/container-publish \
            --nologo \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None
          test -s artifacts/ci/container-publish/TerraScale.Reviewer
          podman build \
            --pull=missing \
            --platform linux/amd64 \
            --tag "localhost/terrascale/ts-reviewer:${source_commit}" \
            --file Containerfile .
          image="localhost/terrascale/ts-reviewer:${source_commit}"
          podman image inspect "${image}"
          test "$(podman image inspect "${image}" --format '{{.Architecture}}')" = amd64
          test "$(podman image inspect "${image}" --format '{{.Os}}')" = linux
          binary_sha256="$(sha256sum artifacts/ci/container-publish/TerraScale.Reviewer | awk '{print $1}')"
          image_id="$(podman image inspect "${image}" --format '{{.Id}}')"
          test "${#binary_sha256}" -eq 64
          test "${image_id#sha256:}" != "${image_id}"
          jq -n \
            --arg sourceCommit "${source_commit}" \
            --arg image "${image}" \
            --arg imageId "${image_id}" \
            --arg binarySha256 "${binary_sha256}" \
            '{schemaVersion: 1, sourceCommit: $sourceCommit, image: $image, imageId: $imageId, binary: "TerraScale.Reviewer", binarySha256: $binarySha256}' \
            > artifacts/ci/container-publish/release-receipt.json

      - name: Upload reviewer release receipt
        uses: https://data.forgejo.org/actions/upload-artifact@v4.4.3
        with:
          # The runner validates action input defaults against the YAML core
          # schema; upload-artifact declares these as quoted strings, so they
          # must be overridden with real booleans or the step fails to start.
          include-hidden-files: false
          overwrite: false
          name: ts-reviewer-release-${{ forgejo.sha }}
          path: artifacts/ci/container-publish/release-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable container on protected main
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          TERRASCALE_BOT_TOKEN: ${{ secrets.TERRASCALE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          source_commit="${FORGEJO_SHA:?event SHA is required}"
          local_image="localhost/terrascale/ts-reviewer:${source_commit}"
          remote_image="git.terrascale.tech/terrascale/ts-reviewer:${source_commit}"
          # The runner exports REGISTRY_AUTH_FILE as a bind-mounted file under
          # /etc/containers; podman login rewrites its auth file via rename,
          # which fails with EBUSY on a bind mount. Use a job-local auth file.
          export REGISTRY_AUTH_FILE="${RUNNER_TEMP:-/tmp}/ts-reviewer-podman-auth.json"
          # The job token authenticates but cannot write packages: the layer
          # upload fails with 'authentication required'. The organization bot
          # token carries the package write grant for the registry.
          printf '%s\n' "${TERRASCALE_BOT_TOKEN:?organization bot token is required}" | \
            podman login git.terrascale.tech --username terrascale-bot --password-stdin >/dev/null
          podman tag "${local_image}" "${remote_image}"
          podman push "${remote_image}"
          podman image inspect "${remote_image}"
