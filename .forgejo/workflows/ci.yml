name: ts-reviewer CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: terrascale-builder
    timeout-minutes: 20
    env:
      TS_REVIEWER_SHA: ${{ forgejo.sha }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: go test ./...
      - run: go vet ./...
      - run: podman build --pull=missing --tag "git.terrascale.tech/terrascale/ts-reviewer:${TS_REVIEWER_SHA}" -f Containerfile .
      - run: |
          podman image inspect "git.terrascale.tech/terrascale/ts-reviewer:${TS_REVIEWER_SHA}"
