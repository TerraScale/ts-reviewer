name: ts-reviewer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Run ts-reviewer checks
    uses: TerraScale/ts-deploy/.forgejo/workflows/deploy.yml@main
    runs-on: terrascale-builder
    with:
      repo: ts-reviewer
    secrets: inherit
