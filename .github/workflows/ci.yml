name: ts-reviewer CI

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact trusted main commit requested by the maintainer command
        required: true
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded branch/PR runs are cancelled. Each main run gets its own group so image publication is never cut off.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CI: true # Standard .NET/Actions CI detection, required by the local-priority rule.

# Runtime deployment is owned by ts-orch on OCI.
jobs:
  checks:
    name: Check and build ts-reviewer
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Verify the requested trusted commit before running CI
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      # No packages.lock.json, so setup-dotnet's built-in cache can't be used; key on the project files instead.
      # Every run restores; only main saves, so PRs never spend the repo cache budget on PR-scoped copies.
      - name: Restore NuGet packages cache
        id: nuget-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'global.json', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: TUnit tests and migration/deployment fixtures
        run: |
          dotnet run --project tests/TerraScale.Reviewer.Tests -c Release
          dotnet run scripts/check-nuget-vulnerabilities.tests.cs
          dotnet run scripts/deploy-alpha.tests.cs
          dotnet run scripts/provision-reviewer-secrets.tests.cs
      - name: Audit all dependencies
        run: dotnet run scripts/check-nuget-vulnerabilities.cs src/TerraScale.Reviewer/TerraScale.Reviewer.csproj tests/TerraScale.Reviewer.Tests/TerraScale.Reviewer.Tests.csproj
      - name: Publish the checked application
        run: dotnet publish src/TerraScale.Reviewer -c Release -r linux-arm64 --self-contained true -o artifacts/ci/reviewer -p:SourceRevisionId="$GITHUB_SHA"
      - name: Save NuGet packages cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
      - name: Verify pinned OCR tooling without model calls
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: false
          tags: ts-reviewer-tooling-check
          # Read-only here; the main-only image job below writes this scope.
          cache-from: type=gha,scope=tooling
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/ci/reviewer/

  image:
    name: Publish the exact checked image
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: checked-${{ github.sha }}
          path: artifacts/ci/reviewer
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
      - name: Publish native tooling base
        id: tooling
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          provenance: false # SDK base-image reader expects one image manifest, not an attestation index.
          push: true
          tags: ghcr.io/terrascale/ts-reviewer:tooling-${{ github.sha }}
          cache-from: type=gha,scope=tooling
          cache-to: type=gha,mode=max,scope=tooling
      - name: PublishContainer directly from the checked publish directory
        env:
          TOOLING_DIGEST: ${{ steps.tooling.outputs.digest }}
        run: |
          # PublishRepositoryUrl is required by the SDK to emit the exact OCI commit label.
          dotnet msbuild src/TerraScale.Reviewer/TerraScale.Reviewer.csproj /t:PublishContainer \
            -p:Configuration=Release -p:RuntimeIdentifier=linux-arm64 -p:SelfContained=true \
            -p:PublishDir="$GITHUB_WORKSPACE/artifacts/ci/reviewer/" \
            -p:PublishRepositoryUrl=true -p:RepositoryUrl=https://github.com/TerraScale/ts-reviewer \
            -p:ContainerBaseImage="ghcr.io/terrascale/ts-reviewer@$TOOLING_DIGEST" \
            -p:ContainerRegistry=ghcr.io -p:ContainerRepository=terrascale/ts-reviewer \
            -p:ContainerImageTag="$GITHUB_SHA" -p:SourceRevisionId="$GITHUB_SHA"
