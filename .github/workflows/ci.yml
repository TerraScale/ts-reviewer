name: ts-reviewer CI

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact trusted main commit requested by the maintainer command
        required: true
        type: string
  pull_request:
  merge_group:

permissions:
  contents: read

# A newer PR or manual run cancels the older one; queue entries stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true # Standard .NET/Actions CI detection, required by the local-priority rule.

# CI validates the application without runtime deployment or image publication.
jobs:
  checks:
    name: Check and build ts-reviewer
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify the requested trusted commit before running CI
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select application changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -n "$BASE_SHA" ] && git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- . \
            ':(exclude)**/*.md' ':(exclude)*.md' ':(exclude)docs/**' \
            ':(exclude)LICENSE' ':(exclude).github/workflows/codeql.yml' \
            ':(exclude).github/dependabot.yml'; then
            echo "application=false" >> "$GITHUB_OUTPUT"
            echo 'Documentation/security configuration only; application checks skipped.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "application=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.application == 'true'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      # PRs restore caches; only a trusted main dispatch can save them.
      - name: Restore NuGet packages and pinned OCR cache
        if: steps.changes.outputs.application == 'true'
        id: nuget-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.nuget/packages
            artifacts/ci/ocr
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}-${{ hashFiles('**/packages.lock.json', 'scripts/*.packages.lock.json', '**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'nuget.config', 'Containerfile', 'scripts/*.cs') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}-
      - name: Restore locked dependencies
        if: steps.changes.outputs.application == 'true'
        run: |
          dotnet restore tests/TerraScale.Reviewer.Tests --locked-mode
          dotnet restore scripts/check-nuget-vulnerabilities.tests.cs --locked-mode --lock-file-path check-nuget-vulnerabilities.tests.packages.lock.json
      - name: Compile with analyzers and run TUnit tests and offline fixtures
        if: steps.changes.outputs.application == 'true'
        run: |
          dotnet run --project tests/TerraScale.Reviewer.Tests -c Release --no-restore
          dotnet run --no-restore scripts/check-nuget-vulnerabilities.tests.cs
      - name: Audit all dependencies
        if: steps.changes.outputs.application == 'true'
        run: |
          dotnet run scripts/check-nuget-vulnerabilities.cs \
            src/TerraScale.Reviewer/TerraScale.Reviewer.csproj \
            tests/TerraScale.Reviewer.Tests/TerraScale.Reviewer.Tests.csproj \
            tests/TerraScale.Reviewer.LeaseCrashChild/TerraScale.Reviewer.LeaseCrashChild.csproj \
            scripts/check-nuget-vulnerabilities.tests.cs
      - name: Save NuGet packages and pinned OCR cache
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.nuget/packages
            artifacts/ci/ocr
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
