name: ts-reviewer CI

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact trusted main commit requested by the maintainer command
        required: true
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded branch/PR runs are cancelled. Each main run gets its own group, so a publish is never cut off and a deploy
# waiting for Alpha approval does not hold back later main checks; the deploy job serializes itself below.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CI: true # Standard .NET/Actions CI detection, required by the local-priority rule.

# PR checks use Alpha's shared runners; trusted builds and deployment use clean hosted runners.
jobs:
  checks:
    name: Check and build ts-reviewer
    runs-on: ${{ github.event_name == 'pull_request' && 'alpha' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Verify the requested trusted commit before running CI
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      # No packages.lock.json, so setup-dotnet's built-in cache can't be used; key on the project files instead.
      - if: github.event_name != 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'global.json', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: TUnit tests and migration/deployment fixtures
        run: |
          dotnet run --project tests/TerraScale.Reviewer.Tests -c Release
          dotnet run scripts/check-nuget-vulnerabilities.tests.cs
          dotnet run scripts/deploy-alpha.tests.cs
          dotnet run scripts/provision-reviewer-secrets.tests.cs
          dotnet run scripts/prepare-alpha-ssh.tests.cs
      - name: Audit all dependencies
        run: dotnet run scripts/check-nuget-vulnerabilities.cs src/TerraScale.Reviewer/TerraScale.Reviewer.csproj tests/TerraScale.Reviewer.Tests/TerraScale.Reviewer.Tests.csproj
      - name: Publish the checked application and Alpha utilities
        run: |
          dotnet publish src/TerraScale.Reviewer -c Release -r linux-x64 --self-contained true -o artifacts/ci/reviewer -p:SourceRevisionId="$GITHUB_SHA"
          dotnet publish scripts/deploy-alpha.cs -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/ci/deploy
          dotnet publish scripts/provision-reviewer-secrets.cs -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/ci/setup
          dotnet publish scripts/prepare-alpha-ssh.cs -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/ci/ssh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # On alpha, build on the shared persistent BuildKit daemon (layer + cache-mount reuse).
          driver: ${{ github.event_name == 'pull_request' && 'remote' || 'docker-container' }}
          endpoint: ${{ github.event_name == 'pull_request' && 'unix:///run/buildkit/buildkitd.sock' || '' }}
      - name: Verify pinned OCR tooling without model calls
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: false
          tags: ts-reviewer-tooling-check
          cache-from: ${{ github.event_name != 'pull_request' && 'type=gha,scope=tooling' || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=tooling' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/ci/reviewer/
            artifacts/ci/deploy/
            artifacts/ci/setup/
            artifacts/ci/ssh/

  image:
    name: Publish the exact checked image
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.archive.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: checked-${{ github.sha }}
          path: artifacts/ci
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish native tooling base
        id: tooling
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          provenance: false # SDK base-image reader expects one image manifest, not an attestation index.
          push: true
          tags: ghcr.io/terrascale/ts-reviewer:tooling-${{ github.sha }}
          cache-from: type=gha,scope=tooling
          cache-to: type=gha,mode=max,scope=tooling
      - name: PublishContainer directly from the checked publish directory
        env:
          TOOLING_DIGEST: ${{ steps.tooling.outputs.digest }}
        run: |
          # PublishRepositoryUrl is required by the SDK to emit the exact OCI commit label.
          dotnet msbuild src/TerraScale.Reviewer/TerraScale.Reviewer.csproj /t:PublishContainer \
            -p:Configuration=Release -p:RuntimeIdentifier=linux-x64 -p:SelfContained=true \
            -p:PublishDir="$GITHUB_WORKSPACE/artifacts/ci/reviewer/" \
            -p:PublishRepositoryUrl=true -p:RepositoryUrl=https://github.com/TerraScale/ts-reviewer \
            -p:ContainerBaseImage="ghcr.io/terrascale/ts-reviewer@$TOOLING_DIGEST" \
            -p:ContainerRegistry=ghcr.io -p:ContainerRepository=terrascale/ts-reviewer \
            -p:ContainerImageTag="$GITHUB_SHA" -p:SourceRevisionId="$GITHUB_SHA"
      - name: Export immutable OCI artifact using the existing runner registry session
        id: archive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          mkdir -p artifacts/ci/alpha
          digest=$(skopeo inspect --authfile "$HOME/.docker/config.json" --format '{{.Digest}}' "docker://ghcr.io/terrascale/ts-reviewer:$GITHUB_SHA")
          skopeo copy --quiet --preserve-digests --src-authfile "$HOME/.docker/config.json" \
            "docker://ghcr.io/terrascale/ts-reviewer@$digest" oci-archive:artifacts/ci/alpha/image.oci.tar
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alpha-image-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/ci/alpha/image.oci.tar

  deployment-gate:
    name: Verify Alpha environment setup
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require an existing main-only Alpha deployment environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/alpha" \
            --jq '.deployment_branch_policy.custom_branch_policies == true' | awk '$1 == "true" { valid = 1 } END { exit !valid }'
          gh api "repos/$GITHUB_REPOSITORY/environments/alpha/deployment-branch-policies" \
            --jq '(.branch_policies | length) == 1 and .branch_policies[0].name == "main" and .branch_policies[0].type == "branch"' \
            | awk '$1 == "true" { valid = 1 } END { exit !valid }'

  deploy:
    name: Deploy Alpha with health check and rollback
    needs: [checks, image, deployment-gate]
    # Stays GitHub-hosted: it reaches alpha over Tailscale, and alpha CI runners have no homelab access.
    runs-on: ubuntu-latest
    environment: alpha
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Short-lived GitHub identity for OpenBao SSH signing and Tailscale federation.
    concurrency:
      group: ts-reviewer-alpha
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: checked-${{ github.sha }}
          path: artifacts/ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: alpha-image-${{ github.sha }}
          path: artifacts/ci/alpha
      - name: Sign an ephemeral deployment key using scoped OpenBao OIDC trust
        env:
          ALPHA_HOST_ED25519_PUBLIC_KEY: ${{ vars.ALPHA_HOST_ED25519_PUBLIC_KEY }} # Unavoidable third-party public host identity; verified by an operator, never discovered with ssh-keyscan.
        run: |
          chmod 700 artifacts/ci/ssh/prepare-alpha-ssh
          artifacts/ci/ssh/prepare-alpha-ssh
      - name: Join Alpha's network using ephemeral workload identity
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ vars.TAILSCALE_ALPHA_CLIENT_ID }} # Unavoidable vendor-issued public federated identity; no OAuth secret.
          audience: https://github.com/TerraScale/ts-reviewer/alpha
          tags: tag:ts-reviewer-deploy
          version: 1.94.2
          ping: alpha.tail057f.ts.net
          log-mode: quiet
      - name: Deploy only current main through the existing Alpha SSH capability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            printf 'A newer main commit supersedes this image; Alpha remains unchanged.\n'
            exit 0
          fi
          ssh_config="$RUNNER_TEMP/ts-reviewer-alpha-ssh/config"
          ssh -F "$ssh_config" -o ConnectTimeout=10 alpha true
          stage="/tmp/ts-reviewer-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -F "$ssh_config" alpha "umask 077; mkdir '$stage'"
          scp -F "$ssh_config" artifacts/ci/alpha/image.oci.tar alpha:"$stage/image.oci.tar"
          scp -F "$ssh_config" -r artifacts/ci/reviewer alpha:"$stage/reviewer"
          ssh -F "$ssh_config" alpha \
            "chmod 711 '$stage'; chmod -R a+rX '$stage/reviewer'; sudo -n /usr/local/libexec/ts-reviewer-deploy '$GITHUB_SHA' '$IMAGE_DIGEST' '$stage'"
      - name: Remove the temporary SSH identity
        if: always()
        run: |
          directory="$RUNNER_TEMP/ts-reviewer-alpha-ssh"
          if [ -d "$directory" ]; then
            rm -f -- "$directory/identity" "$directory/identity.pub" "$directory/identity-cert.pub" "$directory/config" "$directory/known_hosts"
            rmdir -- "$directory"
          fi
